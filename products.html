<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المنتجات | Jimi Store</title>
<meta name="description" content="أحذية جلدية ورياضية بالأسعار. اطلب مباشرة عبر واتساب.">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Lalezar&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="index.html" aria-label="Jimi Store - الرئيسية"><img src="images/logo.png" alt="Jimi Store" width="637" height="320"></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav">القائمة</button>
    <nav id="nav" class="nav" aria-label="التنقل الرئيسي">
      <a href="index.html">الرئيسية</a>
      <a href="products.html" aria-current="page">المنتجات</a>
      <a href="index.html#contact">تواصل معنا</a>
    </nav>
    <a class="btn btn-orange" href="#" target="_blank" rel="noopener" data-wa data-msg="السلام عليكم، عندي استفسار من موقع Jimi Store">اطلب عبر واتساب</a>
  </div>
</header>

<main>
  <section class="page-head">
    <div class="wrap">
      <h1>المنتجات</h1>
      <p>أحذية جلدية ورياضية. اختر النوع واللون، واضغط على الصورة لتكبيرها.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="filters" role="group" aria-label="تصفية حسب النوع" id="filters-type"></div>
      <div class="filters" role="group" aria-label="تصفية حسب اللون" id="filters-color"></div>
      <div class="catalog" id="catalog"></div>
      <p class="empty" id="empty" hidden>لا توجد موديلات بهذا الاختيار حاليا. جرّب نوعا أو لونا آخر.</p>
    </div>
  </section>
</main>

<dialog class="lightbox" id="lightbox" aria-label="عرض الصورة">
  <img src="" alt="">
  <div class="lightbox-bar">
    <div><p data-title></p><p class="lb-price" data-price></p></div>
    <div style="display:flex;gap:.6rem">
      <a class="btn btn-orange" href="#" data-order target="_blank" rel="noopener">اطلب عبر واتساب</a>
      <button class="btn btn-line" type="button" data-close>إغلاق</button>
    </div>
  </div>
</dialog>
<footer class="site-footer">
  <div class="wrap">
    <p class="footer-motto">أناقتك تبدأ من حذائك</p>
    <div class="footer-row">
      <img src="images/logo.png" alt="Jimi Store" width="637" height="320">
      <p class="tagline">Just Imagine Your Self</p>
      <p>© <span data-year>2026</span> Jimi Store</p>
    </div>
  </div>
</footer>
<script src="js/data.js"></script>
<script src="js/site.js"></script>
</body>
</html>
